# DigiPhenoMS FHIR Mapping Pipeline Configuration
# ================================================
# This file defines the overall pipeline: source paths, execution order,
# and output settings. Each step references a mapping config file.

pipeline:
  name: "DigiPhenoMS CSV-to-FHIR Pipeline"
  version: "1.0.0"
  fhir_version: "R4"

# Base identifiers and namespaces
namespaces:
  patient_system: "urn:oid:2.16.840.1.113883.3.digiphenoms.patient"
  assessment_system: "urn:oid:2.16.840.1.113883.3.digiphenoms.assessment"
  module_system: "urn:oid:2.16.840.1.113883.3.digiphenoms.module"
  organization_system: "urn:oid:2.16.840.1.113883.3.digiphenoms.organization"
  custom_code_system: "https://digiphenoms.tu-dresden.de/fhir/CodeSystem/digiphenoms"

# Default organization (all data from same center)
default_organization:
  name: "Dresden Carus"
  identifier: "dresden-carus"

# Input configuration
input:
  base_path: "./data"  # Relative to pipeline working directory
  file_encoding: "utf-8"
  csv_separator: ","

# Output configuration
output:
  base_path: "./output"
  format: "json"                # json or ndjson
  bundle_type: "transaction"    # transaction, batch, or collection
  bundle_max_size: 500          # Max resources per bundle file
  pretty_print: true

# Pipeline steps — executed in order
# Each step maps one CSV source type to FHIR resources.
# Dependencies ensure referential integrity (Patient before Observation etc.)
steps:
  - name: "patient_profile"
    mapping_config: "mapping/patient_profile.mapping.yaml"
    file_pattern: "*patient-profile-overview_training*"
    description: "Map patient demographics to FHIR Patient + Condition"
    enabled: true

  - name: "wrapper_overview"
    mapping_config: "mapping/wrapper_overview.mapping.yaml"
    file_pattern: "*wrapper-overview_training*"
    description: "Map assessment sessions to FHIR Encounter + Device"
    depends_on: ["patient_profile"]
    enabled: true

  - name: "lclat_summary"
    mapping_config: "mapping/lclat_summary.mapping.yaml"
    file_pattern: "*lclat-summary_training*"
    description: "Map LCLA test results to FHIR Observation"
    depends_on: ["patient_profile", "wrapper_overview"]
    enabled: true

  - name: "mdt_summary"
    mapping_config: "mapping/mdt_summary.mapping.yaml"
    file_pattern: "*mdt-summary_training*"
    description: "Map 9HPT results to FHIR Observation"
    depends_on: ["patient_profile", "wrapper_overview"]
    enabled: true

  - name: "npst_summary"
    mapping_config: "mapping/npst_summary.mapping.yaml"
    file_pattern: "*npst-summary_training*"
    description: "Map SDMT results to FHIR Observation"
    depends_on: ["patient_profile", "wrapper_overview"]
    enabled: true

  - name: "wst_summary"
    mapping_config: "mapping/wst_summary.mapping.yaml"
    file_pattern: "*wst-summary_training*"
    description: "Map T25FW results to FHIR Observation"
    depends_on: ["patient_profile", "wrapper_overview"]
    enabled: true

  - name: "nq_detail"
    mapping_config: "mapping/nq_detail.mapping.yaml"
    file_pattern: "*nq-detail_training*"
    description: "Map Neuro-QoL to QuestionnaireResponse + Observation"
    depends_on: ["patient_profile", "wrapper_overview"]
    enabled: true

  - name: "mh_detail"
    mapping_config: "mapping/mh_detail.mapping.yaml"
    file_pattern: "*mh-detail_training*"
    description: "Map medical history to QuestionnaireResponse"
    depends_on: ["patient_profile", "wrapper_overview"]
    enabled: true

  - name: "mrt"
    mapping_config: "mapping/mrt.mapping.yaml"
    file_pattern: "*mrt*"
    description: "Map MRI data to DiagnosticReport + Observation"
    depends_on: ["patient_profile"]
    enabled: true
