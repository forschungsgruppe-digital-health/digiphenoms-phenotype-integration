services:
  # ---------- PostgreSQL for HAPI FHIR ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hapi}
      POSTGRES_USER: ${DB_USER:-hapi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hapi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- HAPI FHIR Server + $cohort-submit Extension ----------
  fhir-server:
    build:
      context: ..
      dockerfile: docker/hapi/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_CONFIG_ADDITIONAL-LOCATION: file:///app/config/
      # DB_HOST may point at an external PostgreSQL; the in-network port of
      # the bundled db service is always 5432 (DB_PORT in .env is only the
      # host-exposed port of that service).
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hapi}
      DB_USER: ${DB_USER:-hapi}
      DB_PASSWORD: ${DB_PASSWORD:-hapi}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # Public base URL written into FHIR responses — set when running
      # behind a reverse proxy (defaults to http://localhost:<SERVER_PORT>/fhir)
      FHIR_SERVER_ADDRESS: ${FHIR_SERVER_ADDRESS:-http://localhost:${SERVER_PORT:-8080}/fhir}
      # ML server ($ml-* operations) — the SSH port forwarding runs on the
      # Docker host, hence host.docker.internal instead of localhost.
      ML_SERVER_URL: ${ML_SERVER_URL:-http://host.docker.internal:8000}
      ML_SERVER_TIMEOUT: ${ML_SERVER_TIMEOUT:-60}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./hapi/application.yaml:/app/config/application.yaml:ro
    ports:
      - "${FHIR_PORT:-8080}:${SERVER_PORT:-8080}"
    healthcheck:
      # distroless image: no shell/curl — probe via the JVM helper shipped
      # in the extension jar
      test:
        [
          "CMD",
          "java",
          "-cp",
          "/app/extra-classes/digiphenoms-extension.jar",
          "de.tud.fgdh.digiphenoms.fhir.HealthCheck",
          "http://localhost:${SERVER_PORT:-8080}/fhir/metadata",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------- Pipeline (one-shot CSV-to-FHIR import runner) ----------
  pipeline:
    build:
      context: ..
      dockerfile: docker/pipeline/Dockerfile
    depends_on:
      fhir-server:
        condition: service_healthy
    environment:
      # Target for $cohort-submit (CLI env fallback for --fhir-endpoint)
      FHIR_BASE_URL: ${FHIR_BASE_URL:-http://fhir-server:${SERVER_PORT:-8080}/fhir}
      # ML server access for --ml-dataset-job (tunnel runs on the Docker host)
      ML_SERVER_URL: ${ML_SERVER_URL:-http://host.docker.internal:8000}
      ML_SERVER_TIMEOUT: ${ML_SERVER_TIMEOUT:-60}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DATA_DIR:-./data}:/data
    # arguments only — the image ENTRYPOINT is already digiphenoms-fhir
    command: >
      --config /app/config
      --data /data
      --submit

volumes:
  pgdata:
