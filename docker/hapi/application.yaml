# HAPI FHIR Server configuration for DigiPhenoMS
# Mounted into the container at /app/config/application.yaml

hapi:
  fhir:
    fhir_version: R4
    # Scan extension package for @Component/@Service/@Configuration beans
    custom_bean_packages: de.tud.fgdh.digiphenoms.fhir
    # Public base URL in FHIR responses — override via FHIR_SERVER_ADDRESS
    # when running behind a reverse proxy / different hostname
    server_address: ${FHIR_SERVER_ADDRESS:http://localhost:${SERVER_PORT:8080}/fhir}
    allow_external_references: true
    default_page_size: 50
    max_page_size: 200
    narrative_enabled: false
    openapi_enabled: true
    bulk_export_enabled: false
    search_result_caching:
      enabled: true
      caching_duration_millis: 60000
    validation:
      requests_enabled: false
      responses_enabled: false
    logging:
      enabled: true
      logger_name: fhirtest.access
      log_exceptions: true
      error_format: "Path[${servletPath}] Source[${requestHeader.x-forwarded-for}] Operation[${operationType} ${operationName} ${idOrResourceName}] UA[${requestHeader.user-agent}] Params[${requestParameters}] ResponseEncoding[${responseEncodingNoDefault}]"

# ML server (synthetic data job API) — used by the $ml-* FHIR operations.
# The URL points at the SSH port forwarding towards the ML server; the
# Bearer token is injected via environment variable (never committed).
ml:
  server:
    url: ${ML_SERVER_URL:http://localhost:8000}
    token: ${ML_SERVER_TOKEN:${API_AUTH_TOKEN:}}
    timeout-seconds: ${ML_SERVER_TIMEOUT:60}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hapi}
    username: ${DB_USER:hapi}
    password: ${DB_PASSWORD:hapi}
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 20
      hibernate.search.enabled: false
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    ca.uhn.fhir: INFO
    de.tud.fgdh.digiphenoms: DEBUG
    org.hibernate.SQL: WARN
