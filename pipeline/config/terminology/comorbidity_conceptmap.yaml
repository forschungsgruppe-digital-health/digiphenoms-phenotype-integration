      equivalence: "equivalent"

    asthma:
      display_source: "Asthma"
      snomed_code: "195967001"
      snomed_display: "Asthma"
      icd10_code: "J45.9"
      icd10_display: "Asthma bronchiale, nicht naeher bezeichnet"
      equivalence: "equivalent"

    _default:
      snomed_code: "64572001"
      snomed_display: "Disease"
      equivalence: "wider"
      note: "Unmapped comorbidity - manual review recommended"
