# ConceptMap: DigiPhenoMS Comorbidity Codes → SNOMED CT / ICD-10
# ================================================================

concept_map:
  id: "digiphenoms-comorbidity-map"
  name: "DigiPhenoMS Comorbidity ConceptMap"
  source_system: "https://digiphenoms.tu-dresden.de/fhir/CodeSystem/comorbidities"
