[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digiphenoms-fhir"
version = "1.0.0"
description = "Configuration-driven CSV-to-FHIR R4 integration pipeline for the DigiPhenoMS project"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "DigiPhenoMS Team", email = "digital-health@tu-dresden.de" },
]
keywords = ["fhir", "hl7", "multiple-sclerosis", "digital-phenotyping", "clinical-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "fhir.resources>=7.0",
]

[project.optional-dependencies]
submit = [
    "httpx>=0.27",
]
ml = [
    "httpx>=0.27",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]

[project.scripts]
digiphenoms-fhir = "digiphenoms_fhir.mapper:main"
digiphenoms-ml = "digiphenoms_fhir.ml_client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/digiphenoms_fhir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["digiphenoms_fhir"]

[tool.coverage.report]
show_missing = true
skip_empty = true
